<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>lights controll</title>
<link rel="icon" href="favicon.png" type="image/png">

<style>
* {
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

body {
  margin: 0;
  width: 100vw;
  height: 100vh;
}

/* ---------- FRAME 1 ---------- */
#login {
  width: 100%;
  height: 100%;
  background: #fff6a3;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

.bulb {
  font-size: 140px;
  margin-bottom: 40px;
}

.login-box {
  display: flex;
  background: #f4c430;
  padding: 14px;
  border-radius: 14px;
}

.login-box input {
  border: none;
  outline: none;
  padding: 12px 16px;
  font-size: 18px;
  border-radius: 10px;
}

.login-box button {
  margin-left: 10px;
  border: none;
  background: white;
  border-radius: 10px;
  font-size: 20px;
  cursor: pointer;
}

/* ---------- FRAME 2 ---------- */
#gridScreen {
  display: none;
  width: 100%;
  height: 100%;
  background: #8fd3f4;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

/* ---------- GRID ---------- */
.grid {
  display: grid;
  grid-template-columns: repeat(2, 220px);
  grid-template-rows: repeat(2, 220px);
  gap: 80px;
}

/* ---------- CARD ---------- */
.card {
  border: 6px solid #ffeb3b;
  box-shadow: 0 0 18px rgba(255,235,59,0.9);
  position: relative;
  cursor: pointer;
  transition: 0.2s;
  overflow: hidden;
  background-size: cover;
  background-position: center;
}

.card::after {
  content: "💡";
  position: absolute;
  top: 10px;
  right: 10px;
  font-size: 24px;
}

.card.active {
  border-color: #b5e48c;
  box-shadow: 0 0 18px rgba(181,228,140,0.9);
}

.card.active::after {
  filter: grayscale(100%);
  opacity: 0.4;
}

/* ---------- WEATHER MINI ---------- */
#weatherMini {
  margin-top: 40px;
  font-size: 22px;
  font-weight: bold;
  color: #0b3c5d;
  text-shadow:
    0 0 6px rgba(255,255,255,0.9),
    0 0 12px rgba(255,255,255,0.7);
}
</style>
</head>

<body>

<!-- FRAME 1 -->
<div id="login">
  <div class="bulb">💡</div>
  <div class="login-box">
    <input type="password" id="password" placeholder="Password"
      onkeydown="if(event.key==='Enter') checkPassword()">
    <button onclick="checkPassword()">→</button>
  </div>
</div>

<!-- FRAME 2 -->
<div id="gridScreen">
  <div class="grid">

    <div class="card"
      style="background-image:url('data:image/jpeg;base64,КАРТИНКА_СЮДА');"      onclick="toggle(this)">
    </div>

    <div class="card"
      style="background-image:url('data:image/jpeg;base64,КАРТИНКА_СЮДА');"      onclick="toggle(this)">
    </div>

    <div class="card"
      style="background-image:url('data:image/jpeg;base64,КАРТИНКА_СЮДА');"
      onclick="toggle(this)">
    </div>

    <div class="card"
      style="background-image:url('data:image/jpeg;base64,КАРТИНКА_СЮДА');"
      onclick="toggle(this)">
    </div>

  </div>

  <!-- WEATHER -->
  <div id="weatherMini">⏳ загрузка погоды…</div>
</div>

<script>
function checkPassword() {
  if (password.value === "test") {
    login.style.display = "none";
    gridScreen.style.display = "flex";
    loadWeather();
  } else {
    alert("Неверный пароль");
  }
}

function toggle(el) {
  el.classList.toggle("active");
}

/* ---------- WEATHER ---------- */
const API_KEY = "YOUR_API_KEY_HERE"; // <-- вставь свой ключ
const CITY = "Kalyazin";
const URL = `https://api.openweathermap.org/data/2.5/weather?q=${CITY}&units=metric&lang=ru&appid=${API_KEY}`;

function icon(desc) {
  if (desc.includes("ясно")) return "☀️";
  if (desc.includes("обла")) return "☁️";
  if (desc.includes("дожд")) return "🌧️";
  if (desc.includes("снег")) return "❄️";
  return "🌡️";
}

function loadWeather() {
  fetch(URL)
    .then(r => r.json())
    .then(d => {
      const t = Math.round(d.main.temp);
      const dsc = d.weather[0].description;
      weatherMini.textContent = `${icon(dsc)} ${t}°C · Калязин`;
    })
    .catch(() => {
      weatherMini.textContent = "⚠️ погода недоступна";
    });
}

setInterval(loadWeather, 20 * 60 * 1000);
</script>

</body>
</html>
